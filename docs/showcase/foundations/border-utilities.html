<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexa - Border Utilities</title>
    <link rel="stylesheet" href="../../../dist/css/flexa.css" />
    <link rel="stylesheet" href="../../../dist/css/themes/flexa-theme-default.css" />
    <link rel="stylesheet" href="../../assets/css/docs.css" />
  </head>
  <body class="fx-demo fx-demo--fullscreen">
    <header class="fx-demo-header">
      <div><p class="fx-demo-header-title">Flexa CSS Framework</p><p class="fx-demo-header-subtitle">Core Documentation</p></div>
      <div class="fx-demo-header-controls">
        <label>Color mode<select id="fx-theme-select"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Auto (System)</option></select></label>
        <label>Text direction<select id="fx-dir-select"><option value="ltr">LTR</option><option value="rtl">RTL</option></select></label>
      </div>
      <a class="fx-demo-link" href="../../index.html">Back</a>
    </header>
    <main class="fx-demo-content">
      <h1 class="fx-demo-hero-title">Border Utilities</h1>
      <p class="fx-demo-hero-description fx-text-muted">Border utilities cover presence, side selection, width, style, and semantic color variants.</p>
      <section class="fx-demo-section fx-mt-4">
        <h2 class="fx-demo-section-title fx-fs-lg fx-fw-semibold fx-mb-3">Width and style</h2>
        <div class="fx-demo-panel fx-demo-row fx-border fx-rounded fx-p-3 fx-d-flex fx-flex-wrap-wrap fx-items-center fx-gap-3">
          <div class="fx-demo-doc-sample-box fx-border fx-border-w-1 fx-border-s-solid">solid 1</div>
          <div class="fx-demo-doc-sample-box fx-border fx-border-w-2 fx-border-s-dashed">dashed 2</div>
          <div class="fx-demo-doc-sample-box fx-border fx-border-w-3 fx-border-s-dotted">dotted 3</div>
        </div>
      </section>
      <section class="fx-demo-section fx-mt-4">
        <h2 class="fx-demo-section-title fx-fs-lg fx-fw-semibold fx-mb-3">Side and semantic color</h2>
        <div class="fx-demo-panel fx-demo-row fx-border fx-rounded fx-p-3 fx-d-flex fx-flex-wrap-wrap fx-items-center fx-gap-3">
          <div class="fx-demo-doc-sample-box fx-border-top fx-border-primary">Top primary</div>
          <div class="fx-demo-doc-sample-box fx-border-bottom fx-border-success">Bottom success</div>
          <div class="fx-demo-doc-sample-box fx-border-left fx-border-danger">Left danger</div>
        </div>
      </section>
    </main>
    <script src="../../../dist/js/flexa.js"></script>
    <script src="../../assets/js/docs.js"></script>
  </body>
</html>
