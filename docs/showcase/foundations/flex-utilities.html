<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexa - Flex Utilities</title>
    <link rel="stylesheet" href="../../../dist/css/flexa.css" />
    <link rel="stylesheet" href="../../../dist/css/themes/flexa-theme-default.css" />
    <link rel="stylesheet" href="../../assets/css/docs.css" />
  </head>
  <body class="fx-demo fx-demo--fullscreen">
    <header class="fx-demo-header">
      <div><p class="fx-demo-header-title">Flexa CSS Framework</p><p class="fx-demo-header-subtitle">Core Documentation</p></div>
      <div class="fx-demo-header-controls">
        <label>Color mode<select id="fx-theme-select"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Auto (System)</option></select></label>
        <label>Text direction<select id="fx-dir-select"><option value="ltr">LTR</option><option value="rtl">RTL</option></select></label>
      </div>
      <a class="fx-demo-link" href="../../index.html">Back</a>
    </header>
    <main class="fx-demo-content">
      <h1 class="fx-demo-hero-title">Flex Utilities</h1>
      <p class="fx-demo-hero-description fx-text-muted">Flex utility classes provide full control over direction, wrapping, distribution, and alignment.</p>
      <section class="fx-demo-section fx-mt-4">
        <h2 class="fx-demo-section-title fx-fs-lg fx-fw-semibold fx-mb-3">Alignment and distribution</h2>
        <div class="fx-demo-panel fx-border fx-rounded">
          <div class="fx-d-flex fx-justify-between fx-items-center fx-border fx-rounded fx-p-2">
            <div class="fx-demo-doc-sample-box">A</div>
            <div class="fx-demo-doc-sample-box">B</div>
            <div class="fx-demo-doc-sample-box">C</div>
          </div>
          <pre><code>&lt;div class="fx-d-flex fx-justify-between fx-items-center"&gt;...&lt;/div&gt;</code></pre>
        </div>
      </section>
      <section class="fx-demo-section fx-mt-4">
        <h2 class="fx-demo-section-title fx-fs-lg fx-fw-semibold fx-mb-3">Wrap and grow</h2>
        <div class="fx-demo-panel fx-border fx-rounded">
          <div class="fx-d-flex fx-flex-wrap-wrap fx-gap-2 fx-border fx-rounded fx-p-2">
            <div class="fx-demo-doc-sample-box fx-flex-grow-1">grow-1</div>
            <div class="fx-demo-doc-sample-box fx-flex-grow-1">grow-1</div>
            <div class="fx-demo-doc-sample-box fx-flex-grow-0">grow-0</div>
          </div>
        </div>
      </section>
    </main>
    <script src="../../../dist/js/flexa.js"></script>
    <script src="../../assets/js/docs.js"></script>
  </body>
</html>
