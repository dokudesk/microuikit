<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexa - Opacity and Transform Utilities</title>
    <link rel="stylesheet" href="../../../dist/css/core.css" />
    <link rel="stylesheet" href="../../../dist/css/themes/theme-default.css" />
    <link rel="stylesheet" href="../../assets/css/wiki.css" />
  </head>
  <body class="fx-demo fx-demo--fullscreen">
    <header class="fx-demo-header">
      <div><p class="fx-demo-header-title">Flexa CSS Framework</p><p class="fx-demo-header-subtitle">Core Documentation</p></div>
      <div class="fx-demo-header-controls">
        <label>Color mode<select id="fx-theme-select"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Auto (System)</option></select></label>
        <label>Text direction<select id="fx-dir-select"><option value="ltr">LTR</option><option value="rtl">RTL</option></select></label>
      </div>
      <a class="fx-demo-link" href="../../index.html">Back</a>
    </header>
    <main class="fx-demo-content">
      <h1 class="fx-demo-hero-title">Opacity and Transform Utilities</h1>
      <p class="fx-demo-hero-description fx-text-muted">Use opacity scales and flip transforms for visual states and mirrored iconography.</p>
      <section class="fx-demo-section fx-mt-4">
        <h2 class="fx-demo-section-title fx-fs-lg fx-fw-semibold fx-mb-3">Opacity scale</h2>
        <div class="fx-demo-panel fx-demo-row fx-border fx-rounded fx-p-3 fx-d-flex fx-flex-wrap-wrap fx-items-center fx-gap-3">
          <div class="fx-demo-doc-sample-box fx-opacity-100">100</div>
          <div class="fx-demo-doc-sample-box fx-opacity-75">75</div>
          <div class="fx-demo-doc-sample-box fx-opacity-50">50</div>
          <div class="fx-demo-doc-sample-box fx-opacity-25">25</div>
        </div>
      </section>
      <section class="fx-demo-section fx-mt-4">
        <h2 class="fx-demo-section-title fx-fs-lg fx-fw-semibold fx-mb-3">Flip transforms</h2>
        <div class="fx-demo-panel fx-demo-row fx-border fx-rounded fx-p-3 fx-d-flex fx-flex-wrap-wrap fx-items-center fx-gap-3">
          <div class="fx-demo-doc-sample-box fx-flip-x">flip-x</div>
          <div class="fx-demo-doc-sample-box fx-flip-y">flip-y</div>
          <div class="fx-demo-doc-sample-box fx-flip-xy">flip-xy</div>
        </div>
      </section>
    </main>
    <script src="../../../dist/js/flexa.js"></script>
    <script src="../../assets/js/wiki.js"></script>
  </body>
</html>
