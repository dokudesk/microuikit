<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexa - Aspect Ratio Utilities</title>
    <link rel="stylesheet" href="../../../dist/css/core.css" />
    <link rel="stylesheet" href="../../../dist/css/themes/theme-default.css" />
    <link rel="stylesheet" href="../../assets/css/wiki.css" />
  </head>
  <body class="fx-demo fx-demo--fullscreen">
    <header class="fx-demo-header">
      <div><p class="fx-demo-header-title">Flexa CSS Framework</p><p class="fx-demo-header-subtitle">Core Documentation</p></div>
      <div class="fx-demo-header-controls">
        <label>Color mode<select id="fx-theme-select"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Auto (System)</option></select></label>
        <label>Text direction<select id="fx-dir-select"><option value="ltr">LTR</option><option value="rtl">RTL</option></select></label>
      </div>
      <a class="fx-demo-link" href="../../index.html">Back</a>
    </header>
    <main class="fx-demo-content">
      <h1 class="fx-demo-hero-title">Aspect Ratio Utilities</h1>
      <p class="fx-demo-hero-description fx-text-muted">Apply standard media proportions using ratio helpers for cards, thumbnails, and responsive placeholders.</p>
      <section class="fx-demo-section fx-mt-4">
        <h2 class="fx-demo-section-title fx-fs-lg fx-fw-semibold fx-mb-3">Preset ratios</h2>
        <div class="fx-demo-panel fx-border fx-rounded fx-p-3">
          <div class="fx-row fx-gx-3 fx-gy-3">
            <div class="fx-col-12 fx-col-md-6"><div class="fx-aspect-square fx-border fx-rounded fx-center">1:1</div></div>
            <div class="fx-col-12 fx-col-md-6"><div class="fx-aspect-video fx-border fx-rounded fx-center">16:9</div></div>
            <div class="fx-col-12 fx-col-md-6"><div class="fx-aspect-4-3 fx-border fx-rounded fx-center">4:3</div></div>
            <div class="fx-col-12 fx-col-md-6"><div class="fx-aspect-9-16 fx-border fx-rounded fx-center">9:16</div></div>
          </div>
          <pre><code>&lt;div class="fx-aspect-video fx-border fx-rounded"&gt;...&lt;/div&gt;</code></pre>
        </div>
      </section>
    </main>
    <script src="../../../dist/js/flexa.js"></script>
    <script src="../../assets/js/wiki.js"></script>
  </body>
</html>
