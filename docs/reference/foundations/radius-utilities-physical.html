<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexa - Radius Utilities (Physical)</title>
    <link rel="stylesheet" href="../../../dist/css/core.css" />
    <link rel="stylesheet" href="../../../dist/css/themes/theme-default.css" />
    <link rel="stylesheet" href="../../assets/css/wiki.css" />
  </head>
  <body class="fx-demo fx-demo--fullscreen">
    <header class="fx-demo-header">
      <div><p class="fx-demo-header-title">Flexa CSS Framework</p><p class="fx-demo-header-subtitle">Core Documentation</p></div>
      <div class="fx-demo-header-controls">
        <label>Color mode<select id="fx-theme-select"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Auto (System)</option></select></label>
        <label>Text direction<select id="fx-dir-select"><option value="ltr">LTR</option><option value="rtl">RTL</option></select></label>
      </div>
      <a class="fx-demo-link" href="../../index.html">Back</a>
    </header>
    <main class="fx-demo-content">
      <h1 class="fx-demo-hero-title">Radius Utilities (Physical)</h1>
      <p class="fx-demo-hero-description fx-text-muted">Physical radius utilities target geometric sides and corners: top, bottom, left, right, and corner combinations.</p>
      <section class="fx-demo-section fx-mt-4">
        <h2 class="fx-demo-section-title fx-fs-lg fx-fw-semibold fx-mb-3">Shape presets</h2>
        <div class="fx-demo-panel fx-demo-row fx-border fx-rounded fx-p-3 fx-d-flex fx-flex-wrap-wrap fx-items-center fx-gap-3">
          <div class="fx-demo-doc-sample-box fx-border fx-rounded-sm">rounded-sm</div>
          <div class="fx-demo-doc-sample-box fx-border fx-rounded-lg">rounded-lg</div>
          <div class="fx-demo-doc-sample-box fx-border fx-rounded-pill">pill</div>
          <div class="fx-demo-doc-sample-box fx-border fx-rounded-circle">circle</div>
        </div>
      </section>
      <section class="fx-demo-section fx-mt-4">
        <h2 class="fx-demo-section-title fx-fs-lg fx-fw-semibold fx-mb-3">Side and corner targeting</h2>
        <div class="fx-demo-panel fx-demo-row fx-border fx-rounded fx-p-3 fx-d-flex fx-flex-wrap-wrap fx-items-center fx-gap-3">
          <div class="fx-demo-doc-sample-box fx-border fx-rounded-top">top</div>
          <div class="fx-demo-doc-sample-box fx-border fx-rounded-left">left</div>
          <div class="fx-demo-doc-sample-box fx-border fx-rounded-top-left">top-left</div>
          <div class="fx-demo-doc-sample-box fx-border fx-rounded-bottom-right">bottom-right</div>
        </div>
      </section>
    </main>
    <script src="../../../dist/js/flexa.js"></script>
    <script src="../../assets/js/wiki.js"></script>
  </body>
</html>
