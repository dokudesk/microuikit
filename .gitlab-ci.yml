# MicroUIKit CSS — GitLab CI/CD Pipeline
# Purpose: run lint, test, and build for branch/MR validation.
# Runtime: Docker jobs on Node 22 Alpine.
# Runner requirement: at least one online runner with tag "microuikit".

variables:
  NODE_VERSION: "22"

default:
  image: node:${NODE_VERSION}-alpine
  tags:
    - microuikit
  before_script:
    - npm ci

stages:
  - lint
  - test
  - build
  - publish

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

# Stage 1: lint
lint:
  stage: lint
  script:
    - npm run lint

# Stage 2: test
test:
  stage: test
  script:
    - npm run test:run

# Stage 3: build
build:
  stage: build
  script:
    - npm run build

# Stage 4: publish
# Publish to npm only when a SemVer tag is pushed (e.g. v1.2.3 or 1.2.3).
publish:
  stage: publish
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/'
      when: on_success
    - when: never
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - export PACKAGE_NAME=$(node -p "require('./package.json').name")
    - export PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "$CI_COMMIT_TAG" != "v${PACKAGE_VERSION}" ] && [ "$CI_COMMIT_TAG" != "${PACKAGE_VERSION}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match package.json version ${PACKAGE_VERSION}; skipping publish."
        exit 0
      fi
    - |
      if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
        echo "npm package ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
        exit 0
      fi
    - npm publish
  variables:
    NODE_AUTH_TOKEN: $NPM_TOKEN
