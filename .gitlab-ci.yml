# Flexa — GitLab CI/CD Pipeline
# Purpose: run lint, test, and build for branch/MR validation.
# Runtime: Docker jobs on Node 22 Alpine.
# Runner requirement: at least one online runner with tag "flexa".

variables:
  NODE_VERSION: "22"

default:
  image: node:${NODE_VERSION}-alpine
  tags:
    - flexa
  before_script:
    - npm ci

stages:
  - lint
  - test
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

# Stage 1: lint
lint:
  stage: lint
  script:
    - npm run lint

# Stage 2: test
test:
  stage: test
  script:
    - npm run test:run

# Stage 3: build
build:
  stage: build
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "master" ]; then
        npm run build:prod
      else
        npm run build:dev
      fi
  artifacts:
    paths:
      - dist/
    expire_in: never