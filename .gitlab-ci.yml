# Flexa CSS — GitLab CI/CD Pipeline
# Purpose: run lint, test, and build for branch/MR validation.
# Runtime: Docker jobs on Node 22 Alpine.
# Runner requirement: at least one online runner with tag "flexa".

variables:
  NODE_VERSION: "22"

default:
  image: node:${NODE_VERSION}-alpine
  tags:
    - flexa
  before_script:
    - npm ci

stages:
  - lint
  - test
  - build
  - publish

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

# Stage 1: lint
lint:
  stage: lint
  script:
    - npm run lint

# Stage 2: test
test:
  stage: test
  script:
    - npm run test:run

# Stage 3: build
build:
  stage: build
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "master" ]; then
        npm run build:prod
      else
        npm run build:dev
      fi
  artifacts:
    paths:
      - dist/
    expire_in: never

# Stage 4: publish
# GitFlow rule: release/* and hotfix/* prepare a version, but npm publish
# happens only after that version is merged into master.
publish:
  stage: publish
  needs:
    - build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - export PACKAGE_NAME=$(node -p "require('./package.json').name")
    - export PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - |
      if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
        echo "npm package ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
        exit 0
      fi
    - npm publish
  variables:
    NODE_AUTH_TOKEN: $NPM_TOKEN
  artifacts:
    paths:
      - dist/
    expire_in: never
