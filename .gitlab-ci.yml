# Flexa — GitLab CI/CD Pipeline
# Lint, test, and release on tags

variables:
  NODE_VERSION: "20"

stages:
  - validate
  - test
  - release

# Block merge to master unless package.json version is bumped
check-version-bump:
  stage: validate
  image: alpine/git
  script:
    - |
      set -e
      if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" != "master" ]; then
        echo "Not targeting master, skip version check"
        exit 0
      fi
      git fetch origin master 2>/dev/null || true
      MASTER_VER=$(git show origin/master:package.json 2>/dev/null | grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || echo "0.0.0")
      CURR_VER=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' package.json | head -1 | cut -d'"' -f4 || true)
      if [ -z "$CURR_VER" ]; then
        echo "ERROR: Could not read version from package.json"
        exit 1
      fi
      echo "Master version: $MASTER_VER | Current version: $CURR_VER"
      if [ "$CURR_VER" = "$MASTER_VER" ]; then
        echo "ERROR: Merge to master requires a version bump in package.json"
        echo "Update version in package.json and push to develop before merging."
        exit 1
      fi
      num() { echo "${1:-0}" | tr -cd '0-9' || echo "0"; }
      a1=$(num "$(echo "$CURR_VER" | cut -d. -f1)"); a2=$(num "$(echo "$CURR_VER" | cut -d. -f2)"); a3=$(num "$(echo "$CURR_VER" | cut -d. -f3)")
      b1=$(num "$(echo "$MASTER_VER" | cut -d. -f1)"); b2=$(num "$(echo "$MASTER_VER" | cut -d. -f2)"); b3=$(num "$(echo "$MASTER_VER" | cut -d. -f3)")
      a1=${a1:-0}; a2=${a2:-0}; a3=${a3:-0}; b1=${b1:-0}; b2=${b2:-0}; b3=${b3:-0}
      if [ "$a1" -gt "$b1" ]; then echo "Version OK: $CURR_VER > $MASTER_VER"; exit 0; fi
      if [ "$a1" -lt "$b1" ]; then echo "ERROR: Version $CURR_VER must be greater than $MASTER_VER"; exit 1; fi
      if [ "$a2" -gt "$b2" ]; then echo "Version OK: $CURR_VER > $MASTER_VER"; exit 0; fi
      if [ "$a2" -lt "$b2" ]; then echo "ERROR: Version $CURR_VER must be greater than $MASTER_VER"; exit 1; fi
      if [ "$a3" -gt "$b3" ]; then echo "Version OK: $CURR_VER > $MASTER_VER"; exit 0; fi
      echo "ERROR: Version $CURR_VER must be greater than $MASTER_VER"; exit 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.test_template: &test_template
  image: node:${NODE_VERSION}-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  before_script:
    - npm ci

lint-and-test:
  <<: *test_template
  stage: test
  script:
    - npm run stylelint:scss
    - npm run build
    - npm run stylelint:css
    - npm run test:run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/

release:
  <<: *test_template
  stage: release
  script:
    - |
      TAG_VERSION="${CI_COMMIT_TAG}"
      PKG_VERSION=$(node -p "require('./package.json').version")
      EXPECTED="v${PKG_VERSION}"
      if [ "$TAG_VERSION" != "$EXPECTED" ]; then
        echo "Error: Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
        exit 1
      fi
      echo "Version OK: $TAG_VERSION"
    - npm run build
    - zip -r flexa-${CI_COMMIT_TAG}.zip dist/
  artifacts:
    paths:
      - flexa-${CI_COMMIT_TAG}.zip
    expire_in: never
  release:
    tag_name: $CI_COMMIT_TAG
    name: Release $CI_COMMIT_TAG
    description: "Flexa $CI_COMMIT_TAG"
    assets:
      links:
        - name: "flexa-${CI_COMMIT_TAG}.zip"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/flexa-${CI_COMMIT_TAG}.zip?job=release"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
