# MicroUIKit - GitLab CI/CD Pipeline
# Purpose: run lint, test, and build for branch/MR validation.
# Runtime: Docker jobs on Node 22 Alpine.
# Runner requirement: at least one online runner with tag "microuikit".

variables:
  NODE_VERSION: "22"

default:
  image: node:${NODE_VERSION}-alpine
  tags:
    - microuikit
  before_script:
    - npm ci

stages:
  - lint
  - test
  - build
  - publish-github
  - publish-npm

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

# Stage 1: lint
lint:
  stage: lint
  script:
    - npm run lint

# Stage 2: test
test:
  stage: test
  script:
    - npm run test:run

# Stage 3: build
build:
  stage: build
  script:
    - npm run build

# Stage 4: publish-github
# Mirror only GitLab master branch to GitHub master branch.
publish-github:
  stage: publish-github
  needs:
    - build
  only:
    - develop
  script:
    - apk add --no-cache git
    - test -n "${GITHUB_REPO}" || (echo "GITHUB_REPO is not set. Example: dokudesk/microuikit" && exit 1)
    - test -n "${GITHUB_TOKEN}" || (echo "GITHUB_TOKEN is not set." && exit 1)
    - git checkout -B develop "$CI_COMMIT_SHA"
    - git fetch --tags origin
    - git remote remove github || true
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    - git push --force github develop:develop
    - git push --tags github --force
  variables:
    GITHUB_TOKEN: $GITHUB_TOKEN    

# Stage 5: publish-npm
# Publish to npm only when a SemVer tag is pushed (e.g. v1.2.3 or 1.2.3).
publish-npm:
  stage: publish-npm
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/'
      when: on_success
    - when: never
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - export PACKAGE_NAME=$(node -p "require('./package.json').name")
    - export PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "$CI_COMMIT_TAG" != "v${PACKAGE_VERSION}" ] && [ "$CI_COMMIT_TAG" != "${PACKAGE_VERSION}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match package.json version ${PACKAGE_VERSION}; skipping publish."
        exit 0
      fi
    - |
      if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
        echo "npm package ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
        exit 0
      fi
    - npm publish
  variables:
    NODE_AUTH_TOKEN: $NPM_TOKEN